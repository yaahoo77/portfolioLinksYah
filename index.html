    <div id="enter-screen">
      <p>click to enter</p>
    </div>
    <div id="particles-js"></div>
    <div id="site">
      <main id="main-card" class="panel">
        <section id="profile">
          <img src="./img/pfp.jpg" alt="yaahoo profile picture" class="profile-pic" />
          <div id="profile-text">
            <h1>yaahoo</h1>
            <p class="bio">Since The Heart Feels Pain So Easily Some Believe Life Is Pain</p>
            <div id="location">
              <p>📍 Poland</p>
            </div>
          </div>
        </section>
        <section id="special-sites">
          <div id="discord" class="card">
            <div>
              <img src="./img/pfp.jpg" id="discord-avatar" alt="Discord avatar" />
              <span id="discord-status-dot"></span>
            </div>
            <div class="card-text">
              <p>yaahoo</p>
              <p id="discord-status">On Discord</p>
            </div>
          </div>
          <div id="slack" class="card">
            <img src="./icons/slack.png" alt="Slack logo" />
            <div class="card-text">
              <p>yaahoo</p>
              <p>On Slack</p>
            </div>
          </div>
        </section>
        <nav id="socials">
          <a href="https://www.instagram.com/yaahoo77_/">
            <img src="./icons/instagram.png" alt="Instagram" />
          </a>
          <a href="https://open.spotify.com/user/xy28xeebsjjkdnfsfq9fn3ihi">
            <img src="./icons/spotify.png" alt="Spotify" />
          </a>
          <a href="https://steamcommunity.com/id/randomurlx/">
            <img src="./icons/steam.png" alt="Steam" />
          </a>
          <a href="https://letterboxd.com/graffit_/">
            <img src="./icons/letterboxd.png" alt="Letterboxd" />
          </a>
          <a href="https://github.com/yaahoo77">
            <img src="./icons/github.png" alt="GitHub" />
          </a>
          <a href="mailto:janchruscik@gmail.com">
            <img src="./icons/email.png" alt="Email" />
          </a>
        </nav>
        <a href="./portfolio.html" id="portfolio-link" class="text-link">more about me →</a>
      </main>
      <section id="music-card" class="panel">
        <img src="./img/vinyl-song.png" alt="Vinyl record with the song cover" id="vinyl" />
        <div id="song-info">
          <div id="song-top">
            <h2>ice - slowed</h2>
            <p>Zertal</p>
            <input id="volume" type="range" min="0" max="1" step="0.01" value="0.2" aria-label="Volume" />
          </div>
          <input id="progress" type="range" min="0" value="0" step="0.1" aria-label="Song progress" />
          <span id="time">0:00</span>
        </div>
        <div id="music-buttons">
          <button id="play-button">
            <img src="./icons/play.png" alt="Play" />
          </button>
          <button id="pause-button">
            <img src="./icons/pause.png" alt="Pause" />
          </button>
        </div>
        <audio src="./audio/song.mp3#t=32" id="music"></audio>
      </section>
